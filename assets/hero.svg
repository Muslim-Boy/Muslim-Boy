<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-labelledby="t">
  <title id="t">Nurmatov Jo'ravoy — Full Stack Developer, frontend-focused</title>

  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="90" />
    </filter>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF5A1F" stop-opacity="1" />
      <stop offset="55%" stop-color="#FF5A1F" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#FF5A1F" stop-opacity="0" />
    </linearGradient>
    <clipPath id="round">
      <rect x="0" y="0" width="1200" height="440" rx="18" />
    </clipPath>
    <style>
      .f { font-family: Inter, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    </style>
  </defs>

  <g clip-path="url(#round)">
    <rect x="0" y="0" width="1200" height="440" fill="#0A0A0A" />
    <circle cx="1150" cy="10" r="250" fill="#FF5A1F" opacity="0.22" filter="url(#glow)" />

    <!-- ============ left column ============ -->
    <text class="f" x="68" y="104" font-size="12" font-weight="600" letter-spacing="3" fill="#FF5A1F">FULL STACK DEVELOPER &#160;&#183;&#160; FRONTEND-FOCUSED</text>

    <text class="f" x="68" y="164" font-size="46" font-weight="800" fill="#FFFFFF">Nurmatov Jo'ravoy</text>

    <text class="f" x="68" y="216" font-size="30" font-weight="700" letter-spacing="0.5" fill="#FFFFFF">I DESIGN. I CODE.</text>
    <text class="f" x="68" y="254" font-size="30" font-weight="700" letter-spacing="0.5" fill="#FFFFFF">I BUILD <tspan fill="#FF5A1F">DIGITAL EXPERIENCES.</tspan></text>

    <text class="f" x="68" y="300" font-size="14.5" fill="#FFFFFF" fill-opacity="0.6">I build web and mobile products end to end — from pixel-perfect</text>
    <text class="f" x="68" y="322" font-size="14.5" fill="#FFFFFF" fill-opacity="0.6">interfaces to the APIs and databases behind them.</text>

    <!-- tech line -->
    <text class="f" x="68" y="368" font-size="11.5" font-weight="600" letter-spacing="2" fill="#FFFFFF" fill-opacity="0.35">REACT&#160; &#183; &#160;VUE&#160; &#183; &#160;NEXT.JS&#160; &#183; &#160;REACT NATIVE&#160; &#183; &#160;NESTJS&#160; &#183; &#160;POSTGRESQL</text>

    <!-- ============ right column — portrait card ============ -->
    <g transform="rotate(3 952 211)">
      <rect x="780" y="66" width="344" height="290" rx="26" fill="url(#plate)" />
    </g>

    <rect x="792" y="78" width="320" height="266" rx="24" fill="#141414" stroke="#FFFFFF" stroke-opacity="0.1" />

    <text class="f" x="952" y="222" font-size="92" font-weight="800" font-style="italic" letter-spacing="-2" fill="#FF5A1F" text-anchor="middle">NJ</text>
    <text class="f" x="952" y="256" font-size="11" font-weight="600" letter-spacing="2.5" fill="#FFFFFF" fill-opacity="0.45" text-anchor="middle">FULL STACK DEVELOPER</text>

    <!-- corner brackets -->
    <g fill="none" stroke="#FF5A1F" stroke-width="2">
      <path d="M808 126 L808 94 L840 94" />
      <path d="M1064 94 L1096 94 L1096 126" />
      <path d="M808 296 L808 328 L840 328" />
      <path d="M1064 328 L1096 328 L1096 296" />
    </g>

    <!-- availability badge -->
    <rect x="812" y="322" width="240" height="58" rx="14" fill="#0F0F0F" stroke="#FF5A1F" stroke-opacity="0.4" />
    <circle cx="840" cy="351" r="9" fill="#FF5A1F" opacity="0.3" />
    <circle cx="840" cy="351" r="5" fill="#FF5A1F" />
    <text class="f" x="860" y="347" font-size="12" fill="#FFFFFF">Available for</text>
    <text class="f" x="860" y="365" font-size="12" font-weight="600" fill="#FFFFFF">Freelance Projects</text>
  </g>
</svg>
